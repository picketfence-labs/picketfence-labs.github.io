<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>レポートの閲覧</title>
<style>
  :root{color-scheme:light;background:#d7ded4;color:#263b2d;font:16px system-ui,sans-serif}
  body{margin:0;padding:24px}
  main{max-width:520px;margin:8vh auto 0;padding:24px;background:#f8faf6;border:1px solid #a8b4a1;border-radius:10px}
  h1{font-size:1.6rem;margin:0 0 16px}
  label,input,button{display:block;font:inherit}
  input{box-sizing:border-box;width:100%;margin:6px 0 14px;padding:10px;border:1px solid #82917b;border-radius:4px}
  button{padding:9px 14px;background:#ccff00;color:#263b2d;border:1px solid #82917b;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>レポートの閲覧</h1>
  <form>
    <label for="key">閲覧キー</label>
    <input id="key" type="password" required autocomplete="off" autocapitalize="none" spellcheck="false">
    <button type="submit">レポートを開く</button>
    <p id="status" role="status"></p>
  </form>
  <noscript>閲覧にはJavaScriptを有効にしてください。</noscript>
</main>
<script>
const bytes = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));
const form = document.querySelector('form');
const input = document.getElementById('key');
const status = document.getElementById('status');
const button = form.querySelector('button');

  event.preventDefault();
  if (!globalThis.crypto?.subtle) {
    status.textContent = 'HTTPSに対応したブラウザーで開いてください。';
    return;

    const value = input.value.trim();
    input.value = '';
